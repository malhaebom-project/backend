services:
  was:
    ports:
      - "127.0.0.1:9090:9090"

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./load-tests/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - loadtest-prometheus-data:/prometheus
    depends_on:
      - was

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/malhaebom-openai-loadtest.json
    volumes:
      - ./load-tests/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./load-tests/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  loadtest-prometheus-data:
