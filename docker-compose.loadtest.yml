services:
  was:
    image: "${LOADTEST_BACKEND_IMAGE:-malhaebom/backend:latest}"
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      SPRING_AI_OPENAI_MAX_RETRIES: "0"
      ANSWER_ASSESSMENT_QUEUE_CAPACITY: "${LOADTEST_ASSESSMENT_QUEUE_CAPACITY:-64}"
      ANSWER_ASSESSMENT_MAX_QUEUE_WAIT: "${LOADTEST_ASSESSMENT_MAX_QUEUE_WAIT:-10s}"
