spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.gkbjfdrnxtngxnaqnkto
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: "${OPENAI_API_KEY}"
      chat:
        model: gpt-5.6-terra
        reasoning-effort: none
        verbosity: low
        max-completion-tokens: 300
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 200ms
        multiplier: 2
        max-interval: 1s

cookie:
  refresh-token:
    domain:

malhaebom:
  cors:
    allowed-origins: https://frontend-eight-psi-26.vercel.app
  assets:
    base-url: https://malhaebom-assets-prod-514090179227-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com

google:
  stt:
    enabled: true
    language-code: en-US
    timeout: 15s
    location: global
    recognizer-id: _
    model: short
    adaptation-boost: 5
  tts:
    enabled: false
    language-code: en-US
    voice-name: en-US-Standard-C
    speaking-rate: 1.0
    pitch: 0.0
  cloud:
    credentials:
      location: file:/app/config/google-credentials.json
