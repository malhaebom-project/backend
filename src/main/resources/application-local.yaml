spring:
  datasource:
    url: jdbc:h2:mem:malhaebom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

malhaebom:
  cors:
    allowed-origins: http://localhost:3000
  assets:
    base-url: https://malhaebom-assets-prod-514090179227-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com
  stt:
    language-code: en-US
    timeout: 15s
    max-recording-duration: 15s
    google:
      project-id: malhaebom-504606
      location: global
      recognizer-id: _
      model: short
      credentials:
        location: file:./config/google-credentials.json
