spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:h2:mem:malhaebom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: "${OPENAI_API_KEY}"
      chat:
        model: gpt-5.6-terra
        reasoning-effort: none
        verbosity: low
        max-completion-tokens: 300
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 200ms
        multiplier: 2
        max-interval: 1s

malhaebom:
  cors:
    allowed-origins: http://localhost:3000
  assets:
    base-url: https://malhaebom-assets-prod-514090179227-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com

google:
  stt:
    enabled: true
    language-code: en-US
    timeout: 15s
    location: us
    recognizer-id: _
    model: chirp_3
    adaptation-boost: 5
  tts:
    enabled: false
    language-code: en-US
    voice-name: en-US-Standard-C
    speaking-rate: 1.0
    pitch: 0.0
  cloud:
    credentials:
      location: file:./config/google-credentials.json
