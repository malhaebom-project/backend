spring:
  application:
    name: malhaebom
  profiles:
    default: local
  config:
    import:
      - optional:file:./config/application.yaml
      - optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    openai:
      api-key: "${OPENAI_API_KEY}"
      max-retries: 1
      chat:
        model: gpt-5.6-terra
        reasoning-effort: none
        verbosity: low
        max-completion-tokens: 300

malhaebom:
  assets:
    base-url: https://malhaebom-assets-prod-514090179227-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com
  answer-assessment:
    max-concurrent-requests: ${ANSWER_ASSESSMENT_MAX_CONCURRENT_REQUESTS:32}
  answer-submission:
    processing-timeout: 25s
    processing-lease: 60s
    async:
      request-timeout: 30s
  speech:
    async:
      request-timeout: 20s
      max-concurrent-requests: ${STT_MAX_CONCURRENT_REQUESTS:8}
      processing-lease: 60s

gcp:
  credentials: file:./config/google-credentials.json
  stt:
    enabled: true
    language-code: en-US
    timeout: 15s
    location: us
    recognizer-id: _
    model: chirp_3
    adaptation-boost: 5
  tts:
    enabled: false
    language-code: en-US
    voice-name: en-US-Standard-C
    speaking-rate: 1.0
    pitch: 0.0
