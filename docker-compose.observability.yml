name: malhaebom-loadtest-observability

services:
  management-tunnel:
    build:
      context: ./load-tests/observability/ssh-tunnel
    restart: unless-stopped
    environment:
      LOADTEST_SSH_HOST: "${LOADTEST_SSH_HOST:-missing@invalid}"
    ports:
      - "127.0.0.1:${LOADTEST_LOCAL_API_PORT:-18080}:18080"
      - "127.0.0.1:${LOADTEST_LOCAL_MANAGEMENT_PORT:-19090}:19090"
    volumes:
      - "${LOADTEST_SSH_IDENTITY_FILE:-./.private/load-tests/missing-key}:/run/source-key:ro"

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:${LOADTEST_LOCAL_PROMETHEUS_PORT:-19091}:9090"
    volumes:
      - ./load-tests/observability/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - loadtest-prometheus-data:/prometheus
    depends_on:
      - management-tunnel

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOADTEST_LOCAL_GRAFANA_PORT:-13000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/malhaebom-openai-loadtest.json
    volumes:
      - ./load-tests/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./load-tests/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.2.0
    profiles:
      - runner
    working_dir: /scripts
    volumes:
      - ./load-tests/answer-submission:/scripts:ro

volumes:
  loadtest-prometheus-data:
