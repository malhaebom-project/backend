plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}
ext {
	springAiVersion = "2.0.0"
}

group = 'com.malhaebom'
version = '0.0.1-SNAPSHOT'
description = 'malhaebom'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation platform('com.google.cloud:libraries-bom:26.83.0')
	implementation 'com.google.cloud:google-cloud-speech'
	implementation 'com.google.cloud:google-cloud-texttospeech'
	implementation platform('software.amazon.awssdk:bom:2.46.13')
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.ai:spring-ai-openai'
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets {
	loadTest {
		java.srcDir 'src/loadTest/java'
		resources.srcDir 'src/loadTest/resources'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	loadTestImplementation.extendsFrom implementation
	loadTestRuntimeOnly.extendsFrom runtimeOnly
}

idea {
	module {
		testSources.from(sourceSets.loadTest.java.srcDirs)
		testResources.from(sourceSets.loadTest.resources.srcDirs)
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'live'
	}
}

tasks.register('liveTest', Test) {
	description = 'Runs tests that call external services.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'live'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('loadTestFixtures', JavaExec) {
	description = 'Creates or removes answer-submission load-test fixtures.'
	group = 'verification'
	dependsOn tasks.named('loadTestClasses')
	classpath = sourceSets.loadTest.runtimeClasspath
	mainClass = 'com.malhaebom.malhaebom.loadtest.AnswerSubmissionLoadFixtureTool'
	systemProperty 'load.test.action',
		providers.gradleProperty('loadTestAction').getOrElse('seed')
	systemProperty 'load.test.run-id',
		providers.gradleProperty('loadTestRunId').getOrElse('')
	systemProperty 'load.test.stages',
		providers.gradleProperty('loadTestStages').getOrElse('10,100,200,300')
	systemProperty 'load.test.manifest',
		providers.gradleProperty('loadTestManifest').getOrElse(
			'load-tests/results/fixture-manifest.json'
		)
}

tasks.register('loadTestServer', JavaExec) {
	description = 'Runs the backend with load-test-only support beans.'
	group = 'verification'
	dependsOn tasks.named('loadTestClasses')
	classpath = sourceSets.loadTest.runtimeClasspath
	mainClass = 'com.malhaebom.malhaebom.MalhaebomApplication'
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
